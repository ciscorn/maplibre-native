name: core-release-minimal

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: core-release-minimal-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      core_sha: ${{ steps.resolve.outputs.core_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Resolve and verify core revision
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          core_sha="$(git rev-parse HEAD)"
          test "${#core_sha}" -eq 40
          grep -Fq \
            'static const auto instance = std::make_shared<EGLDisplayConfig>(Key{});' \
            platform/linux/src/headless_backend_egl.cpp
          echo "core_sha=${core_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create matching headers archive
        run: |
          tar czf maplibre-native-headers.tar.gz \
            include \
            platform/default/include \
            vendor/maplibre-native-base/include \
            vendor/maplibre-native-base/deps/variant/include \
            vendor/maplibre-native-base/deps/geometry.hpp/include \
            vendor/maplibre-native-base/deps/geojson.hpp/include \
            vendor/metal-cpp \
            vendor/expected-lite/include

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata-${{ steps.resolve.outputs.core_sha }}
          path: |
            maplibre-native-headers.tar.gz
            LICENSES.core.md
          if-no-files-found: error
          retention-days: 7

  build-linux-x64-opengl:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.core_sha }}
          submodules: recursive

      - name: Verify runner architecture
        run: test "$(uname -m)" = x86_64

      - name: Install dependencies
        run: .github/scripts/install-linux-deps

      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: armerge@2

      - name: Build Linux x64 OpenGL amalgam
        run: |
          set -euo pipefail
          cmake --preset linux-opengl \
            -DCMAKE_CXX_COMPILER_LAUNCHER="" \
            -DMLN_CREATE_AMALGAMATION=ON
          cmake --build build-linux-opengl --target mbgl-core
          cp \
            build-linux-opengl/libmbgl-core-amalgam.a \
            libmaplibre-native-core-amalgam-linux-x64-opengl.a
          member="$(ar t libmaplibre-native-core-amalgam-linux-x64-opengl.a | head -n 1)"
          mkdir archive-check
          (
            cd archive-check
            ar x ../libmaplibre-native-core-amalgam-linux-x64-opengl.a "${member}"
            file "${member}" | grep -Eq 'x86-64|x86_64'
          )

      - name: Upload Linux amalgam
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-opengl-${{ needs.prepare.outputs.core_sha }}
          path: libmaplibre-native-core-amalgam-linux-x64-opengl.a
          if-no-files-found: error
          retention-days: 7

  build-linux-arm64-opengl:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.core_sha }}
          submodules: recursive

      - name: Verify runner architecture
        run: test "$(uname -m)" = aarch64

      - name: Install dependencies
        run: .github/scripts/install-linux-deps

      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: armerge@2

      - name: Build Linux ARM64 OpenGL amalgam
        run: |
          set -euo pipefail
          cmake --preset linux-opengl \
            -DCMAKE_CXX_COMPILER_LAUNCHER="" \
            -DMLN_CREATE_AMALGAMATION=ON
          cmake --build build-linux-opengl --target mbgl-core
          cp \
            build-linux-opengl/libmbgl-core-amalgam.a \
            libmaplibre-native-core-amalgam-linux-arm64-opengl.a
          member="$(ar t libmaplibre-native-core-amalgam-linux-arm64-opengl.a | head -n 1)"
          mkdir archive-check
          (
            cd archive-check
            ar x ../libmaplibre-native-core-amalgam-linux-arm64-opengl.a "${member}"
            file "${member}" | grep -Eq 'ARM aarch64|ARM64'
          )

      - name: Upload Linux ARM64 amalgam
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-arm64-opengl-${{ needs.prepare.outputs.core_sha }}
          path: libmaplibre-native-core-amalgam-linux-arm64-opengl.a
          if-no-files-found: error
          retention-days: 7

  build-macos-arm64-metal:
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.core_sha }}
          submodules: recursive

      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64

      - run: brew install webp libuv

      - uses: taiki-e/install-action@2ca9b94c269419b7b0c711c09d0b21c4e1d51145 # v2.83.1
        with:
          tool: armerge@2

      - name: Build macOS ARM64 Metal amalgam
        run: |
          set -euo pipefail
          cmake --preset macos-metal \
            -DCMAKE_CXX_COMPILER_LAUNCHER="" \
            -DMLN_WITH_GLFW=OFF \
            -DMLN_CREATE_AMALGAMATION=ON
          cmake --build build-macos-metal --target mbgl-core
          cp \
            build-macos-metal/libmbgl-core-amalgam.a \
            libmaplibre-native-core-amalgam-macos-arm64-metal.a
          test "$(lipo -archs libmaplibre-native-core-amalgam-macos-arm64-metal.a)" = arm64

      - name: Upload macOS amalgam
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64-metal-${{ needs.prepare.outputs.core_sha }}
          path: libmaplibre-native-core-amalgam-macos-arm64-metal.a
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - prepare
      - build-linux-x64-opengl
      - build-linux-arm64-opengl
      - build-macos-arm64-metal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.core_sha }}
          fetch-depth: 1

      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-${{ needs.prepare.outputs.core_sha }}'
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            LICENSES.core.md
            libmaplibre-native-core-amalgam-linux-arm64-opengl.a
            libmaplibre-native-core-amalgam-linux-x64-opengl.a
            libmaplibre-native-core-amalgam-macos-arm64-metal.a
            maplibre-native-headers.tar.gz
          )
          for file in "${expected[@]}"; do
            test -f "release-assets/${file}"
          done
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          (
            cd release-assets
            sha256sum "${expected[@]}" > SHA256SUMS
          )

      - name: Publish immutable core release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SHA: ${{ needs.prepare.outputs.core_sha }}
        run: |
          set -euo pipefail
          tag="core-${CORE_SHA}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release ${tag} already exists; refusing to replace immutable assets" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists; refusing to attach assets to an existing tag" >&2
            exit 1
          fi
          gh release create "${tag}" \
            --target "${CORE_SHA}" \
            --draft \
            --latest=false \
            --title "${tag}" \
            --notes "Precompiled MapLibre Native core amalgams for MMPF. Source commit: ${CORE_SHA}." \
            release-assets/*
          gh release edit "${tag}" --draft=false --latest=false
